<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | OAW — Online Auction World</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <script src="js/theme.js"></script>
</head>
<body>

  <div class="auth-page">
    <!-- Globe Toggle -->
    <div class="auth-container">
      <!-- Globe Toggle -->
      <div class="auth-globe" style="display: flex; gap: 8px;">
        <button class="globe-btn" id="globe-btn" aria-label="Toggle Direction" title="Switch to RTL" style="border: 1px solid var(--border); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold); background: none; cursor: pointer;">
          <span class="globe-text" style="font-size: 10px; font-weight: 800; letter-spacing: 0.5px;">LTR</span>
        </button>
        <!-- Theme Toggle -->
        <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Theme">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
      <div class="auth-logo">
        <a href="home1.html">
          <svg class="oaw-logo-svg" width="100" height="45" viewBox="0 0 140 90" xmlns="http://www.w3.org/2000/svg">
            <text x="6" y="66" font-family="var(--font-serif), serif" font-size="62" font-weight="900" fill="var(--gold)">OAW</text>
            <path d="M 66 28 L 66 14 L 138 6 L 138 84 L 66 76 L 66 62" fill="none" stroke="var(--gold)" stroke-width="5" stroke-linecap="square" />
          </svg>
        </a>
      </div>

      <div class="auth-header">
        <h1 class="auth-title">Welcome back!</h1>
        <p class="auth-subtitle">Please login to your account</p>
      </div>

      <form class="auth-form" action="user-dashboard.html">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" placeholder="john@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" placeholder="Enter your password" required>
        </div>

        <div class="auth-meta">
          <label class="remember-me">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" class="forgot-pass">Forgot password?</a>
        </div>

        <button type="submit" class="auth-btn btn-auth-primary">LOGIN</button>
      </form>

      <div class="auth-divider">OR</div>

      <div class="social-btns">
        <button class="btn-social">
          <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google" class="social-icon">
          Continue with Google
        </button>
        <button class="btn-social">
          <img src="https://www.svgrepo.com/show/303114/facebook-3-logo.svg" alt="Facebook" class="social-icon">
          Continue with Facebook
        </button>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </div>

  <script>
    const globeBtn = document.getElementById('globe-btn');
    function setAuthDir(dir) {
      document.documentElement.dir = dir;
      document.body.dir = dir;
      localStorage.setItem('oaw-dir', dir);
      globeBtn.title = dir === 'rtl' ? 'Switch to LTR' : 'Switch to RTL';
      const textSpan = globeBtn.querySelector('.globe-text');
      if (textSpan) textSpan.textContent = dir.toUpperCase();
    }

    globeBtn.addEventListener('click', () => {
      const isRtl = document.documentElement.dir === 'rtl';
      setAuthDir(isRtl ? 'ltr' : 'rtl');
    });

    // Init on load
    (function() {
      const savedDir = localStorage.getItem('oaw-dir') || 'ltr';
      setAuthDir(savedDir);
    })();
  </script>
</body>
</html>
